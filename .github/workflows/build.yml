name: 构建校验

# 目的：push / PR 时先用**和线上一致的 Hugo 版本**把主站构建一遍。
# 模板写错、短代码语法错、front matter 坏了这类问题在这里就被
# 拦下来（报错带文件名和行号），不用等 Cloudflare Pages 构建失败才发现。
#
# 版本要和 Cloudflare Pages 项目里的 HUGO_VERSION 保持一致。改版本时三处一起改：
#   本机 hugo version ／ 下面 peaceiris/actions-hugo 的 hugo-version ／ Cloudflare 项目的环境变量
# 还有 hugo.toml 的 [module.hugoVersion]。
#
# ⚠️ Hugo 0.170 起没有 extended 版（LibSass 已移除），`hugo version` 不带 extended 字样，
#    所以这里不写 `extended: true`、也不校验 extended。本站没用 Sass。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"

      - name: 核对 Hugo 版本
        run: |
          hugo version
          hugo version | grep -q "v0.170.0" || {
            echo "::error::Hugo 版本不是 0.170.0，请同步 .github/workflows/build.yml 与 Cloudflare 的 HUGO_VERSION"
            exit 1
          }

      - name: 构建主站
        run: hugo --minify --gc --destination public

      - name: 准备内部链接检查副本
        run: |
          cp -R public public-linkcheck
          find public-linkcheck -type f -name '*.html' -exec \
            perl -pi -e 's#https://hulatu\.com/#/#g; s#https://hulatu\.com#/#g' {} +

      - name: 检查内部链接与锚点
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir public-linkcheck
            --index-files index.html
            --include-fragments=anchor-only
            --no-progress
            --max-concurrency 12
            'public-linkcheck/**/*.html'
          fail: true

      - name: 检查 HTML 结构（重复 id / 同名 landmark / img 缺 alt / 标题跳级）
        run: bash scripts/check-html.sh public

      - name: 检查中文标题锚点
        run: |
          # 中文标题的拼音锚点在**构建期**算（partials/heading-slug.html），md 里不再写 {#pinyin}。
          # 它要查 data/pinyin.json；表里缺字 → 那一节回退成 #%e4%b9%a0%e6%83%af 这种中文锚点。
          # 这步只检查不修改；缺了就在 macOS 上跑 python3 scripts/sync-pinyin.py 补字再提交。
          python3 scripts/sync-pinyin.py --check
