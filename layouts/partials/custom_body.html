<!-- hulatu.com 全局 / 搜索面板（脚本在 assets/js/palette.js） -->
<div class="hl-cmd-overlay" id="hlCmdOverlay" role="dialog" aria-modal="true" aria-label="站内快捷搜索">
  <div class="hl-cmd-dialog">
    <div class="hl-cmd-input-wrap">
      <span class="hl-mono" style="color: var(--hl-mute);">/</span>
      <input class="hl-cmd-input" id="hlCmdInput" type="text" placeholder="搜索文章、周刊、工具..." autocomplete="off">
      <span class="hl-kbd">ESC</span>
    </div>
    <ul class="hl-cmd-results" id="hlCmdResults"></ul>
    <div class="hl-cmd-foot">
      <span>↑↓ 选择 · Enter 跳转</span>
      <span>按 / 或 ⌘K 随时唤起</span>
    </div>
  </div>
</div>
