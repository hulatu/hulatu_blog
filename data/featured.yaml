# 精选页「主编导读」（2026-11-21）
#
# 这里是 /featured/ 的唯一数据源。原来的页面把 featured: true 的文章按日期
# 倒序铺成一张 17 条的列表，读者看不出先读哪篇；现在改成 3 组、每组 2 篇，
# 每篇一句推荐语。
#
# ⚠️ 文件路径相对 content/，用 `where site.RegularPages "File.Path" ...` 查页。
#    不要在这里写死 URL —— 文章改 slug / 日期时 URL 会变，路径不会。
# ⚠️ 只放 5–8 篇。featured: true 仍然可以标更多文章（首页入口只看有没有），
#    但这一页是「先读这几篇」，不是「全部精选」。
# ⚠️ 加一组就加 `- name/note/items`，模板会自动多渲染一段，不用改 HTML。

intro: "如果你刚来，建议从这三组开始。每组两篇，读完大概就知道这个站在写什么。"

groups:
  - name: "写作与博客"
    note: "为什么写、怎么写，以及一个博客应该长什么样。"
    items:
      - file: "posts/我为什么喜欢写东西以及为什么需要个人博客.md"
        note: "写东西和做博客是两件事，这篇把两者分开讲。"
      - file: "posts/当我谈喜欢or讨厌的博客，我在谈些什么.md"
        note: "如果你也做博客，这篇是我对好设计和坏设计的真实偏好。"

  - name: "工具与设备"
    note: "不堆参数，只留下每天真的会打开的东西。"
    items:
      - file: "posts/使用 Mac 5+ 年，我保留了哪些软件.md"
        note: "五年多之后还在用的应用，才是真的在用。"
      - file: "posts/如何配置一个好用的浏览器.md"
        note: "从选择、设置到扩展和书签，一个下午能照着配完。"

  - name: "跑步与生活"
    note: "跑步是这几年对我影响最大的一件事。"
    items:
      - file: "posts/为何很多人重启，从跑步开始.md"
        note: "跑了五年多之后，我对「为什么从跑步开始」的理解。"
      - file: "posts/平价跑步装备-实用篇.md"
        note: "想开始跑但不想先花一大笔钱，从这份清单开始。"
