# ============================================================================
#  /tools/ 工具索引页的数据源（2026-11-08 新增，2026-11-08 精简）
#
#  由 layouts/_default/tools.html 渲染成一列条目（模板在那边，样式在
#  assets/css/custom.css 第 41 段）。
#  **加第 4 个工具 = 在下面追加一条，不用碰模板、不用碰样式。**
#
#  2026-11-08 精简：每条只留 name / tagline / repo —— 这一页只做一件事，
#  把人引到 GitHub 仓库。演示、安装脚本、设计笔记以前也在这里，现在都
#  不放了，各仓库自己的 README 里有。
#
#  ⚠️ tagline **一律写成一行，不要折行**。用 YAML 的 `>-` 折叠长文本
#     会把换行变成**空格** —— 英文里无所谓，中文里就是「头条 要清洗」这种
#     凭空多出来的空格，而构建不报错、编辑器里也看不出来（2026-11-08 实测）。
#     一行太长就用编辑器的软换行，别真的敲回车。
# ============================================================================

- name: 文章分发台
  tagline: 一篇 Markdown 文章，转换后可分发到多个平台。
  repo: https://github.com/hulatu/Publishing_Platform

- name: 少数派阅读增强
  tagline: 把少数派改成更适合阅读的地方。
  repo: https://github.com/hulatu/sspai-tidy

- name: 网页全屏
  tagline: 一个键，把视频变成网页全屏。
  repo: https://github.com/hulatu/Video-Fullscreen
