# 关于页相册拼贴（2026-11-25）
#
# 用法：在 content/about.md 里插入 {{< photo-collage >}}。
# 这里的位置全部按 1040 × 520 的画布换算成百分比：
#   x = left / 1040 × 100，y = top / 520 × 100，w = width / 1040 × 100。
# 拖动后的新位置也会以百分比写回，所以缩放窗口不会错位。
#
# 每个元素：
#   type    photo | video | stamp
#   shape   rect（拍立得）| circle（圆形）| stamp（邮票，type 写成 stamp 即可）
#   ar      宽高比，CSS 写法，例如 "3 / 4"；stamp 固定 2 / 3，不用写
#   src     图片地址；video 时是视频地址（MP4）
#   webm    video 可选，WebM 备份；motion.js 按 canPlayType 只选一种，不会两种都下
#   poster  video 的封面图
#   label   邮票右上角的城市名
#   sub     邮票城市名下面的小字
#   x/y/w   百分比；rot 旋转角度；z 层级
#
# ⚠️ 现在用的是博客里已有的图片做占位。换成自己的照片时，
#    直接把 src 换成新地址即可；本地文件放 static/ 下，写成 /images/xxx.jpg。

