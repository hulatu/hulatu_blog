# 胡拉图说 —— 站点配置
# 主题在 themes/hugo-bearneo/；本站改动都走站点层（layouts/ + 本文件 + content/）。

baseURL = "https://hulatu.com/"
theme = "hugo-bearneo"
title = "胡拉图说"
# 0.158 起 languageCode 已弃用，改用 locale。
# ⚠️ 主题的 baseof.html 用的是 .Site.Language.Locale（站点层覆盖过，见 layouts/_default/baseof.html）。
locale = "zh-CN"
# 中文按「字」而不是「空格分词」计数 —— 影响 .Summary 截断与 .WordCount。
hasCJKLanguage = true
enableRobotsTXT = true
# 升级包要求：用 Git 最后提交时间喂 Lastmod（RSS / sitemap / Last Updated 徽章）。
enableGitInfo = true

# 关 taxonomy 列表页（/tags/、/categories/），词条页仍然生成。
# ⚠️ 必须写在任何 [table] 之前，否则静默失效。
disableKinds = ["taxonomy"]

# posts 与 weekly 都落 /posts/YYYY/MM/DD/slug/。
[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"
  weekly = "/posts/:year/:month/:day/:slug/"

[params]
  description = "胡拉图说：一个普通研究生的个人博客，喜欢记录思考、分享日常、观察生活，内容包含但不限于运动、健康、成长、科研与工具折腾。"

  favicon = "favicon.svg"

  # feed <image> 必须是 PNG，宽高与文件一致（144）。
  feedIcon = "images/feed-icon.png"
  # 非文章页的兜底分享图，由 scripts/gen-og.js 生成（与文章分享卡同一套版式）；换文件名要同步改脚本。
  images = ["images/share.png"]

  # 分享图兜底尺寸；换图要同步改。
  ogImageWidth = 1200
  ogImageHeight = 630

  # ⚠️ 必须写**字面量 ©**；&copy; 会被转义成六个字符。
  copyright = "版权所有 © 2025-2026 · 胡拉图"

  copyrightNote = "本站内容采用"
  licenseName = "CC BY-NC-SA 4.0"
  licenseURL = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  dateFormat = "2006-01-02"

  # 两个 Bear Blog 风格开关（主题自带）
  groupByYear = true      # 列表页按年份分组，年份用 <h2> 当小标题
  showPostCount = true    # 列表页顶部显示「共 N 篇。」

  # 目录：>1200px 右侧悬浮，≤1200px 正文顶部折叠；断点/守卫在 custom.css 第 20 / 46 段。
  toc = true
  imageZoom = true        # 点正文图片全屏放大（纯 CSS，checkbox + label）
  externalLinksNewTab = true

  # 首页最近更新条数；设 0 隐藏列表。
  homeRecentCount = 5


  [params.footer]
    hideCopyright = false
    hideSitemap = false
    hideMadeWithLine = false
    hideRSSAndEmail = false

  [params.RSS]
    enableRSS = true
    pageLimit = 20

  [params.author]
    name = "胡拉图"
    email = "hello@hulatu.com"

  # giscus（GitHub Discussions）。mapping=pathname，老评论按 URL 接上。
  # ⚠️ repo 已改名为 hulatu/hulatu_blog；repoId 是节点 ID，改名不变。
  [params.giscus]
    enabled = true
    repo = "hulatu/hulatu_blog"
    repoId = "R_kgDOTApIwg"
    category = "Announcements"
    categoryId = "DIC_kwDOTApIws4DCXd5"
    mapping = "pathname"
    strict = false
    reactions = true
    emitMetadata = false
    inputPosition = "bottom"
    lang = "zh-CN"
    theme = "preferred_color_scheme"

  # GoatCounter 走同源代理 functions/stats/[[path]].js；
  # 绕过时改 [params.analytics] goatcounter 与 custom_head.html 里的 s.src（见代理文件注释）。
  [params.analytics]
    goatcounter = "https://hulatu.com/stats/count"

# 导航完全由 [[menu.main]] 驱动，顺序看 weight。nav.html 不写死任何链接。
# ⚠️ 邻居 /roll/、文章 /archive/、订阅 /index.xml；分类入口在 /archive/ 顶部与 /map/。
# ⚠️ 7 项在 375–390px 是零余量，别再压 gap 或字号（custom.css 第 00 段）。
[[menu.main]]
  name = "首页"
  url = "/"
  weight = 10

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 20

[[menu.main]]
  name = "邻居"
  url = "/roll/"
  weight = 30

[[menu.main]]
  name = "工具"
  url = "/tools/"
  weight = 35

[[menu.main]]
  name = "周刊"
  url = "/weekly/"
  weight = 40

[[menu.main]]
  name = "归档"
  url = "/archive/"
  weight = 50

[[menu.main]]
  name = "订阅"
  url = "/index.xml"
  weight = 60

# 文章里嵌了腾讯视频的裸 <iframe>，Goldmark 默认会把它们丢掉并吐 WARN。
[markup.goldmark.renderer]
  unsafe = true

# 2026-11-23：单独一行的图片不再包进 <p>。图片渲染钩子输出的是 <figure>，而 <figure> 不能放在
# <p> 里 —— 浏览器会把 <p><figure>…</figure></p> 拆成「空 <p> + figure + 空 <p>」，
# 全站约 700 个空段落。空段落的外边距（18 / 27px）都不大于 figure 自己的 27px，
# 合并后间距一像素不变，所以关掉它纯粹是让 HTML 合法。
# ⚠️ 图片和文字写在同一段里（不是单独一行）时仍会在 <p> 里，那是 Markdown 写法决定的。
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# 2026-11-23：中文段落里折行写的地方不再多出一个空格。
# Markdown 把段内单个换行当成空格，浏览器在两个汉字之间也照样显示（全站 26 处，12 处在
# 《为何很多人重启，从跑步开始》）。simple 规则只在换行两边都是汉字 / 假名 / 、。「」这类 CJK 符号时
# 去掉它；有一边是英文就照旧留空格。只去空格，不会把一行变成一段 —— 要分段仍然空一行。
# ⚠️ 别换成 eastAsianLineBreaksStyle = "css3draft"：它在任一侧是标点或汉字时都去空格，
#    第 17 期周刊里 12 行「英文标题 + 换行 + 中文译文」会粘成一串（模拟 Goldmark 源码规则得出）。
# ⚠️ 已知边界：换行前是全角 ，？！（U+FF0C 等，不在 simple 的字表里）时仍留空格，全站 6 处；
#    换行前一行以加粗 / 链接等结尾时也留空格，全站 1 处（2026-11-24 按实际构建结果核对）。
# ⚠️ 它会让带自定义标题的提示框（> [!NOTE] 标题 + 换行 + 正文）把正文吞进标题 ——
#    2026-11-24 在 _markup/render-blockquote.html 里补救，原因写在那里。
[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = "simple"

# 2026-11-23：数学公式在构建期渲染成 MathML（_markup/render-passthrough.html → transform.ToMath）。
# 页面上零 JS、零 CSS、不连任何 CDN。行内写 \( … \)，独立成行写 $$ … $$ 或 \[ … \]。
# ⚠️ 刻意没开行内 $ … $（Typora / Obsidian 的习惯写法）：Hugo 文档说明，用构建期 KaTeX 时，
#    正文里单独出现的 $（「花了 $5」）没法可靠地转义，会被当成公式。要开先想清楚以后写不写美元。
# ⚠️ 公式写错时构建直接失败并报出文件和行号（钩子里的 errorf），不会在页面上留红字。
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

# 2026-11-23：==高亮== → <mark>。extras 里只开这一项：
# · 下标 H~2~O 要求关掉删除线，而且中文常写「3~5 公里」「1~2 天」，同一段出现两次就会被吃成下标；
# · 上标 1^st^ / 插入 ++文字++ 中文几乎用不上，后者还可能和 C++ 撞。
[markup.goldmark.extensions.extras.mark]
  enable = true

# 代码高亮：noClasses=false 让 Chroma 输出类名，配色由 custom.css 第 12 段提供。
# ⚠️ 改回 true 会写内联 monokai 前景 + 主题浅底，代码块几乎看不见。
[markup.highlight]
  noClasses = false
  # 2026-11-23：```js {linenos=true} 的行号改成行内 span.ln（默认是两栏表格）。
  # 表格版会被 single.html 包进 .table-wrap、吃到正文表格的边框和内边距，复制时也难剔掉行号。
  # ⚠️ 别在文章里写 linenos=table，理由同上。
  lineNumbersInTable = false

# 目录只收 h2 / h3。
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# 只有 home 与周刊出 feed；taxonomy/term 压回 HTML-only。
[outputs]
  # home 的 JSON 是搜索索引（体积见 MAINTENANCE.md 第 0 节的自动区块）。
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services.rss]
  # 每个 feed 的条目上限。
  limit = 20

[taxonomies]
  category = "categories"
  tag = "tags"

# 相关文章：threshold=20，tags 200 / categories 50，includeNewer=true。
# ⚠️ 默认 threshold 80 会让 2–3 标签的文章一条都推不出来。
# ⚠️ 改阈值前先数产物里的 .post-related 数量。
[related]
  threshold = 20
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 200

  [[related.indices]]
    name = "categories"
    weight = 50


[minify]
  disableXML = true
  minifyOutput = true

# 版本三边一致（本机 / Actions / Cloudflare Pages 的 HUGO_VERSION）。
# ⚠️ Hugo 0.170 起没有 extended 版，别再写 extended = true。
[module]
  [module.hugoVersion]
    min = "0.170.0"
